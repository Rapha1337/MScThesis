name: Empirical PA v1.2 duration-only checks

on:
  push:
    branches:
      - codex/empirical-pa-v1-2-duration-only

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Compile changed Python modules
        run: >
          python -m py_compile
          Simulation/empirical_pa_v1_2_stochastic.py
          Simulation/run_llm_pa_decision.py
          Simulation/run_full_pa_simulation.py
          Analysis/t1_medoid_pa_validation_v1_2.py
      - name: Run focused tests
        run: >
          python -m pytest
          Simulation/tests/test_empirical_pa_v1_2.py
          Simulation/tests/test_empirical_pa_v1_2_stochastic.py
          Simulation/tests/test_llm_decision_validation.py
          Simulation/tests/test_full_pa_simulation.py
          Analysis/tests/test_t1_medoid_pa_validation_v1_2.py
          -q

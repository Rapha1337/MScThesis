name: LLM2 JSON retry checks

on:
  push:
    branches:
      - codex/llm2-json-retry

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Compile changed module
        run: python -m py_compile Simulation/run_llm_pa_decision.py
      - name: Run focused tests
        run: >
          python -m pytest
          Simulation/tests/test_empirical_pa_v1_2_stochastic.py
          Simulation/tests/test_llm_decision_validation.py
          Simulation/tests/test_full_pa_simulation.py
          -q

name: State assessment path checks

on:
  push:
    branches:
      - codex/state-assessment-windows-path-fix

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
      - run: python -m pip install -r requirements.txt
      - name: Compile state assessment
        run: python -m py_compile Simulation/state_assessment.py
      - name: Run focused tests
        run: >
          python -m pytest
          Simulation/tests/test_state_assessment.py
          Simulation/tests/test_full_pa_simulation.py
          -q
